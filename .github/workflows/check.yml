name: check
on: [pull_request, push]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: python -m pip install mcp
      - run: python -m unittest discover -s tests
      - name: 检查本次改动到的卡带(首发内置卡带除外)
        run: |
          base=${{ github.event.pull_request.base.sha || 'HEAD~1' }}
          ids=$(git diff --name-only "$base" HEAD -- cartridges | cut -d/ -f2 | sort -u | grep -vE '^(pocket-.*|blind-companions|four-things-in-my-pocket)$' || true)
          ids="pocket-circuit $ids"
          for id in $ids; do [ -d "cartridges/$id" ] || continue; echo "$id"; done | xargs python tools/check_cartridge.py
